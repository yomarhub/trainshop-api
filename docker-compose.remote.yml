services:
  frontend:
    # build:
    #   context: ./frontend
    #   dockerfile: Dockerfile
    image: yomarhub/trainshop-frontend:latest
    container_name: trainshop_frontend
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    # build:
    #   context: ./api
    #   dockerfile: Dockerfile
    image: yomarhub/trainshop-api:latest
    container_name: trainshop_api
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: trainshop_db
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:
