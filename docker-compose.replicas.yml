services:
  nginx:
    image: nginx:alpine
    container_name: trainshop_lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3

  api1:
    # build: "./api"
    image: trainshop-api:1.2.0
    environment:
      INSTANCE_NAME: api1
      DB_HOST: db
    depends_on:
      - db

  api2:
    # build: "./api"
    image: trainshop-api:1.2.0
    environment:
      INSTANCE_NAME: api2
      DB_HOST: db
    depends_on:
      - db

  api3:
    # build: "./api"
    image: trainshop-api:1.2.0
    environment:
      INSTANCE_NAME: api3
      DB_HOST: db
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trainshop
      POSTGRES_USER: trainshop_user
      POSTGRES_PASSWORD: trainshop_password
    volumes:
      - replica_db_data:/var/lib/postgresql/data

volumes:
  replica_db_data: